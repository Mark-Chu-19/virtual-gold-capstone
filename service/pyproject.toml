[project]
name = "vg-redactor"
version = "3.0.0"
description = "Virtual Gold local redaction service (V3 API)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115", "uvicorn>=0.30", "pydantic>=2.7", "httpx>=0.27",
  "prometheus_client>=0.20", "pyyaml>=6", "python-ulid>=2",
  "cryptography>=44",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
# Privacy Research components; also run: python -m spacy download en_core_web_lg
privacy = ["presidio-analyzer>=2.2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["vg_redactor*"]
