[project]
name = "vg-redactor"
version = "0.4.2"
description = "Virtual Gold local redaction service (API contract 0.4.2)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115", "uvicorn>=0.30", "pydantic>=2.7", "httpx>=0.27",
  "prometheus_client>=0.20", "pyyaml>=6", "python-ulid>=2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
