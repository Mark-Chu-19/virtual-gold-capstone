# Same job for a Prometheus installed directly on the machine (no Docker):
#   prometheus --config.file=dashboards/prometheus.native.yml
global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: vg-redactor
    static_configs:
      - targets: ["127.0.0.1:9100"]

  # Optional P2 exporter; see README for the aggregate snapshot/report contracts.
  - job_name: vg-external
    static_configs:
      - targets: ["127.0.0.1:9101"]
