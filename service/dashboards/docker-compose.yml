# Prometheus + Grafana for the redaction service (local development and the demo).
# Start:  docker compose -f dashboards/docker-compose.yml up -d     (from service/)
# Stop:   docker compose -f dashboards/docker-compose.yml down
# Prometheus  http://127.0.0.1:9090      Grafana  http://127.0.0.1:3000  (admin / $GRAFANA_ADMIN_PASSWORD, default "admin")
# Both ports are bound to 127.0.0.1 only. No data leaves the machine.
services:
  prometheus:
    image: prom/prometheus:v2.55.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    extra_hosts: ["host.docker.internal:host-gateway"]   # reach the service running on the host

  grafana:
    image: grafana/grafana:11.3.0
    depends_on: [prometheus]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ["127.0.0.1:3000:3000"]

volumes:
  prometheus-data:
  grafana-data:
